[flake8]
max-line-length = 88
extend-ignore = E203
per-file-ignores =
    tests/test_browser_runtime.py:E501
exclude =
    .git,
    .venv,
    build,
    dist,
    .mypy_cache,
    .pytest_cache

[tool:pytest]
testpaths = tests
addopts = --cov=jinja_bootstrap_spa --cov-report=term-missing --cov-report=xml

[coverage:run]
branch = True
source = jinja_bootstrap_spa

[coverage:report]
show_missing = True
skip_covered = False
fail_under = 85

[mypy]
python_version = 3.11
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = True
no_implicit_optional = True
strict_equality = True
packages = jinja_bootstrap_spa

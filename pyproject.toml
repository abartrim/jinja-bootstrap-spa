[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jinja-bootstrap-spa"
version = "0.1.0"
description = "Composable Jinja2 + Bootstrap 5 UI primitives with a typed fragment runtime."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Aaron Bartrim"},
]
dependencies = [
  "Jinja2>=3.1,<4",
  "Flask>=3.0,<4",
]
keywords = ["jinja2", "bootstrap", "spa", "ui", "components", "typescript"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
  "black>=24.0,<25",
  "djlint>=1.36,<2",
  "flake8>=7.0,<8",
  "isort>=5.13,<6",
  "mypy>=1.10,<2",
  "playwright>=1.52,<2",
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
]

[project.urls]
Homepage = "https://github.com/abartrim/jinja-bootstrap-spa"
Issues = "https://github.com/abartrim/jinja-bootstrap-spa/issues"
Repository = "https://github.com/abartrim/jinja-bootstrap-spa"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jinja_bootstrap_spa = ["templates/*.html", "static/*.js", "static/*.d.ts", "py.typed"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

[tool.djlint]
profile = "jinja"
indent = 2
max_line_length = 88
format_css = true
format_js = true
ignore = "H006,H020,H021"

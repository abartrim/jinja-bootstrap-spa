<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {% block title %}jinja-bootstrap-spa{% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <style>
      @keyframes jbsSwapPulse {
        0% {
          box-shadow:
            0 0 0 0 rgba(255, 153, 0, 0.95),
            inset 0 0 0 3px rgba(255, 153, 0, 0.95);
          background-color: rgba(255, 193, 7, 0.26);
        }
        65% {
          box-shadow:
            0 0 0 14px rgba(255, 153, 0, 0),
            inset 0 0 0 2px rgba(255, 153, 0, 0.55);
        }
        100% {
          box-shadow:
            0 0 0 0 rgba(255, 153, 0, 0),
            inset 0 0 0 0 rgba(255, 153, 0, 0);
          background-color: transparent;
        }
      }

      @keyframes jbsRowPulse {
        0% {
          background-color: rgba(255, 193, 7, 0.34);
        }
        70% {
          background-color: rgba(255, 193, 7, 0.16);
        }
        100% {
          background-color: transparent;
        }
      }

      @keyframes jbsNotModifiedPulse {
        0% {
          box-shadow:
            0 0 0 0 rgba(13, 202, 240, 0.92),
            inset 0 0 0 3px rgba(13, 202, 240, 0.92);
          background-color: rgba(13, 202, 240, 0.2);
        }
        65% {
          box-shadow:
            0 0 0 14px rgba(13, 202, 240, 0),
            inset 0 0 0 2px rgba(13, 202, 240, 0.5);
        }
        100% {
          box-shadow:
            0 0 0 0 rgba(13, 202, 240, 0),
            inset 0 0 0 0 rgba(13, 202, 240, 0);
          background-color: transparent;
        }
      }

      .jbs-swap-pulse {
        animation: jbsSwapPulse 1.45s ease-out;
        position: relative;
      }

      .jbs-not-modified-pulse {
        animation: jbsNotModifiedPulse 1.1s ease-out;
        position: relative;
      }

      .jbs-stream-row-pulse {
        animation: jbsRowPulse 1.35s ease-out;
      }

      [data-jbs-component] {
        transition:
          opacity 160ms ease,
          filter 160ms ease,
          box-shadow 160ms ease;
      }

      [data-jbs-component].jbs-is-loading {
        position: relative;
      }

      [data-jbs-component].jbs-is-loading > * {
        opacity: 0.66;
        filter: saturate(0.92);
      }

      [data-jbs-component].jbs-is-loading::before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 100%;
        height: 3px;
        z-index: 6;
        background:
          linear-gradient(
            90deg,
            rgba(13, 110, 253, 0) 0%,
            rgba(13, 110, 253, 0.3) 15%,
            rgba(13, 110, 253, 0.95) 50%,
            rgba(13, 110, 253, 0.3) 85%,
            rgba(13, 110, 253, 0) 100%
          );
        background-size: 200% 100%;
        animation: jbsLoadingBar 1s linear infinite;
      }

      [data-jbs-component].jbs-is-loading::after {
        content: attr(data-jbs-loading-label);
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        z-index: 7;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: var(--bs-primary-text-emphasis, #052c65);
        background: rgba(13, 110, 253, 0.12);
        border: 1px solid rgba(13, 110, 253, 0.25);
        box-shadow: 0 2px 8px rgba(13, 110, 253, 0.08);
      }

      [data-jbs-component].jbs-is-error {
        box-shadow: inset 0 0 0 2px rgba(220, 53, 69, 0.24);
      }

      [data-jbs-component].jbs-is-unchanged {
        box-shadow: inset 0 0 0 2px rgba(13, 202, 240, 0.18);
      }

      @keyframes jbsLoadingBar {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .jbs-swap-pulse,
        .jbs-not-modified-pulse,
        .jbs-stream-row-pulse {
          animation: none;
        }

        [data-jbs-component].jbs-is-loading::before {
          animation: none;
          background:
            linear-gradient(
              90deg,
              rgba(13, 110, 253, 0.2) 0%,
              rgba(13, 110, 253, 0.95) 50%,
              rgba(13, 110, 253, 0.2) 100%
            );
        }

        .jbs-swap-pulse {
          outline: 3px solid rgba(255, 153, 0, 0.95);
          outline-offset: 2px;
          background-color: rgba(255, 193, 7, 0.18);
        }

        .jbs-not-modified-pulse {
          outline: 3px solid rgba(13, 202, 240, 0.9);
          outline-offset: 2px;
          background-color: rgba(13, 202, 240, 0.14);
        }

        .jbs-stream-row-pulse {
          background-color: rgba(255, 193, 7, 0.22);
        }
      }
    </style>
    {% block head_extra %}{% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    {# Load the jinja-bootstrap-spa runtime from your application's static path. #}
    {% block spa_runtime %}{% endblock %}
    {% block body_extra %}{% endblock %}
  </body>
</html>

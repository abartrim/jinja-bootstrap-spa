<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {% block title %}jinja-bootstrap-spa{% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <style>
      @keyframes jbsSwapPulse {
        0% {
          box-shadow: 0 0 0 0 rgba(13, 110, 253, 0.45);
          background-color: rgba(13, 110, 253, 0.08);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(13, 110, 253, 0);
          background-color: transparent;
        }
      }

      @keyframes jbsRowPulse {
        0% {
          background-color: rgba(25, 135, 84, 0.22);
        }
        100% {
          background-color: transparent;
        }
      }

      .jbs-swap-pulse {
        animation: jbsSwapPulse 1.2s ease-out;
      }

      .jbs-stream-row-pulse {
        animation: jbsRowPulse 1.2s ease-out;
      }

      @media (prefers-reduced-motion: reduce) {
        .jbs-swap-pulse,
        .jbs-stream-row-pulse {
          animation: none;
        }
      }
    </style>
    {% block head_extra %}{% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    {# Load the jinja-bootstrap-spa runtime from your application's static path. #}
    {% block spa_runtime %}{% endblock %}
    {% block body_extra %}{% endblock %}
  </body>
</html>
